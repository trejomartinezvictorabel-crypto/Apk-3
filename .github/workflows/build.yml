name: Build APK desde ZIP

on:
  push:
    paths: ["*.zip"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.11.1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Localizar y descomprimir el ZIP (plano o con carpeta raíz)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(*.zip)
          [ ${#zips[@]} -gt 0 ] || { echo "::error::No hay ningún .zip en la raíz del repositorio"; exit 1; }
          best=""; bt=-1
          for f in "${zips[@]}"; do
            t=$(git log -1 --format=%ct -- "$f" 2>/dev/null || echo 0); t=${t:-0}
            if [ "$t" -ge "$bt" ]; then bt=$t; best=$f; fi
          done
          echo "ZIP elegido: $best"
          rm -rf _unzip project
          mkdir _unzip
          unzip -q -o "$best" -d _unzip
          find _unzip -name '__MACOSX' -prune -exec rm -rf {} + || true
          find _unzip -name '.DS_Store' -delete || true
          # Raíz = carpeta más superficial que contiene settings.gradle
          root=""
          cand=$(find _unzip -maxdepth 4 \( -name settings.gradle -o -name settings.gradle.kts \) | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -n "$cand" ]; then root=$(dirname "$cand"); fi
          if [ -z "$root" ]; then
            root=_unzip
            while [ "$(find "$root" -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ] && [ -d "$(find "$root" -mindepth 1 -maxdepth 1)" ]; do
              root=$(find "$root" -mindepth 1 -maxdepth 1)
            done
          fi
          if [ "$root" = "_unzip" ]; then mv _unzip project; else mv "$root" project; fi
          echo "Raíz del proyecto: ${root#_unzip}"
          ls -la project

      - name: Validar proyecto (archivos, sintaxis, dependencias públicas, prueba del motor)
        shell: bash
        run: |
          [ -f project/tools/validate_project.py ] || { echo "::error::Falta tools/validate_project.py dentro del ZIP"; exit 1; }
          python3 project/tools/validate_project.py project --red

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Reparar Android SDK con Python
        shell: bash
        run: |
          python3 - <<'EOF'
          import os, shutil, subprocess

          sdk_root = os.environ.get("ANDROID_SDK_ROOT") or os.environ.get("ANDROID_HOME") or "/usr/local/lib/android/sdk"
          os.environ["ANDROID_SDK_ROOT"] = sdk_root
          os.environ["ANDROID_HOME"] = sdk_root

          candidates = [
              os.path.join(sdk_root, "cmdline-tools", "latest", "bin", "sdkmanager"),
              os.path.join(sdk_root, "cmdline-tools", "16.0", "bin", "sdkmanager"),
              shutil.which("sdkmanager"),
          ]
          sdkmanager = next((p for p in candidates if p and os.path.isfile(p)), None)

          latest_dir = os.path.join(sdk_root, "cmdline-tools", "latest")
          v16_dir = os.path.join(sdk_root, "cmdline-tools", "16.0")
          if os.path.isdir(v16_dir) and not os.path.exists(latest_dir):
              os.makedirs(os.path.dirname(latest_dir), exist_ok=True)
              os.symlink(v16_dir, latest_dir)
              cand_latest = os.path.join(latest_dir, "bin", "sdkmanager")
              if os.path.isfile(cand_latest):
                  sdkmanager = cand_latest

          if not sdkmanager:
              raise SystemExit("::error::No se encontró sdkmanager en el runner")

          subprocess.run(
              [sdkmanager, f"--sdk_root={sdk_root}", "--licenses"],
              input="y\n" * 30,
              text=True,
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
              check=False,
          )

          packages = ["platform-tools", "platforms;android-36", "build-tools;36.0.0"]
          res = subprocess.run(
              [sdkmanager, f"--sdk_root={sdk_root}", *packages],
              input="y\n" * 30,
              text=True,
              check=False,
          )
          if res.returncode != 0:
              raise SystemExit(f"::error::sdkmanager falló con código {res.returncode}")

          print("SDK reparado correctamente en:", sdk_root)
          EOF

      - name: Plataforma 36
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Clave de firma (debug) para el APK release
        shell: bash
        run: |
          mkdir -p ~/.android
          [ -f ~/.android/debug.keystore ] || keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Validar entorno (Java 17, Gradle, SDK 36, build-tools)
        shell: bash
        run: python3 project/tools/validate_project.py project --entorno

      - name: Compilar APK release
        run: gradle --no-daemon -p project assembleRelease

      - name: Resumen del APK
        shell: bash
        run: |
          {
            echo "### APK generado"
            echo '```'
            ls -lh project/app/build/outputs/apk/release/*.apk
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: simulador3d-release-apk
          path: project/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
