name: Build APK desde ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.11.1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Localizar y descomprimir el ZIP
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(*.zip)
          [ ${#zips[@]} -gt 0 ] || { echo "::error::No hay ningún .zip en la raíz del repositorio"; exit 1; }

          best=""; bt=-1
          for f in "${zips[@]}"; do
            t=$(git log -1 --format=%ct -- "$f" 2>/dev/null || echo 0); t=${t:-0}
            if [ "$t" -ge "$bt" ]; then bt=$t; best=$f; fi
          done
          echo "ZIP elegido: $best"

          rm -rf _unzip project
          mkdir -p _unzip
          unzip -q -o "$best" -d _unzip
          find _unzip -name '__MACOSX' -prune -exec rm -rf {} + || true
          find _unzip -name '.DS_Store' -delete || true

          root=""
          cand=$(find _unzip -maxdepth 5 \( -name settings.gradle -o -name settings.gradle.kts -o -name pubspec.yaml \) | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -n "$cand" ]; then root=$(dirname "$cand"); fi
          if [ -z "$root" ]; then
            root=_unzip
            while [ "$(find "$root" -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ] && [ -d "$(find "$root" -mindepth 1 -maxdepth 1)" ]; do
              root=$(find "$root" -mindepth 1 -maxdepth 1)
            done
          fi

          if [ "$root" = "_unzip" ]; then mv _unzip project; else mv "$root" project; fi
          echo "Raíz del proyecto: ${root#_unzip}"
          ls -la project

      - name: Agregar permisos al AndroidManifest con Python
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os, re

          perms = [
              '<uses-permission android:name="android.permission.INTERNET"/>',
              '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>',
              '<uses-permission android:name="android.permission.CAMERA"/>',
              '<uses-permission android:name="android.permission.RECORD_AUDIO"/>',
              '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>',
              '<uses-permission android:name="android.permission.WAKE_LOCK"/>',
              '<uses-permission android:name="android.permission.VIBRATE"/>',
              '<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>',
          ]

          manifests = glob.glob('project/**/AndroidManifest.xml', recursive=True)
          if not manifests:
              print('Aviso: no se encontró AndroidManifest.xml en project/')

          for mpath in manifests:
              txt = open(mpath, encoding='utf-8').read()
              faltantes = []
              for p in perms:
                  m_name = re.search(r'android:name="([^"]+)"', p)
                  perm_name = m_name.group(1) if m_name else p
                  if perm_name not in txt:
                      faltantes.append('    ' + p)

              if faltantes:
                  bloque = '\n'.join(faltantes) + '\n'
                  if '<application' in txt:
                      txt = txt.replace('<application', bloque + '    <application', 1)
                  elif '</manifest>' in txt:
                      txt = txt.replace('</manifest>', bloque + '</manifest>', 1)
                  open(mpath, 'w', encoding='utf-8').write(txt)
                  print(f'Agregados {len(faltantes)} permisos a {mpath}')
              else:
                  print(f'Todos los permisos ya estaban presentes en {mpath}')
          PY

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK con Python
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os, shutil, subprocess, urllib.request, zipfile

          sdk_root = os.environ.get('ANDROID_SDK_ROOT') or os.environ.get('ANDROID_HOME') or '/usr/local/lib/android/sdk'
          if not os.path.exists(sdk_root):
              sdk_root = '/tmp/android-sdk'
          os.makedirs(sdk_root, exist_ok=True)

          lic_dir = os.path.join(sdk_root, 'licenses')
          os.makedirs(lic_dir, exist_ok=True)
          licenses = {
              'android-sdk-license': '24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd\n',
              'android-sdk-preview-license': '84831b9409646a918e30573bab4c9c91346d8abd\n',
              'android-googletv-license': '60108f7c06a1e840564b3b7198856d2250360a08\n',
              'mips-android-sys-image-license': 'e9acab5b5fbb560abb72ca8051a89f0c0f7604c8\n',
          }
          for fname, content in licenses.items():
              fp = os.path.join(lic_dir, fname)
              try:
                  if not os.path.exists(fp):
                      with open(fp, 'w', encoding='utf-8') as f:
                          f.write(content)
              except PermissionError:
                  pass

          managers = glob.glob(os.path.join(sdk_root, 'cmdline-tools/*/bin/sdkmanager'))
          if not managers:
              sdk_root = '/tmp/android-sdk'
              os.makedirs(sdk_root, exist_ok=True)
              os.makedirs(os.path.join(sdk_root, 'licenses'), exist_ok=True)
              for fname, content in licenses.items():
                  with open(os.path.join(sdk_root, 'licenses', fname), 'w', encoding='utf-8') as f:
                      f.write(content)
              zip_tmp = '/tmp/commandlinetools.zip'
              if not os.path.exists(zip_tmp):
                  url = 'https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip'
                  urllib.request.urlretrieve(url, zip_tmp)
              cl_dir = os.path.join(sdk_root, 'cmdline-tools')
              os.makedirs(cl_dir, exist_ok=True)
              with zipfile.ZipFile(zip_tmp, 'r') as zf:
                  zf.extractall(cl_dir)
              extracted = os.path.join(cl_dir, 'cmdline-tools')
              latest_dir = os.path.join(cl_dir, 'latest')
              if os.path.isdir(extracted) and not os.path.exists(latest_dir):
                  os.rename(extracted, latest_dir)
              managers = glob.glob(os.path.join(sdk_root, 'cmdline-tools/*/bin/sdkmanager'))

          if managers:
              sm = sorted(managers)[-1]
              try:
                  os.chmod(sm, 0o755)
              except PermissionError:
                  pass
              env = os.environ.copy()
              env['ANDROID_HOME'] = sdk_root
              env['ANDROID_SDK_ROOT'] = sdk_root
              subprocess.run(['bash', '-c', f'yes | "{sm}" --sdk_root="{sdk_root}" --licenses'], env=env, check=False)
              print(f'SDK preparado con {sm} en {sdk_root}')

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              env_file.write(f'ANDROID_HOME={sdk_root}\n')
              env_file.write(f'ANDROID_SDK_ROOT={sdk_root}\n')
          PY

      - name: Plataforma 36
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os, subprocess

          sdk_root = os.environ.get('ANDROID_SDK_ROOT') or os.environ.get('ANDROID_HOME') or '/usr/local/lib/android/sdk'
          managers = glob.glob(os.path.join(sdk_root, 'cmdline-tools/*/bin/sdkmanager')) + glob.glob('/tmp/android-sdk/cmdline-tools/*/bin/sdkmanager')
          if not managers:
              raise SystemExit('ERROR: No se encontró sdkmanager en el SDK.')

          sm = sorted(managers)[-1]
          env = os.environ.copy()
          env['ANDROID_HOME'] = sdk_root
          env['ANDROID_SDK_ROOT'] = sdk_root

          subprocess.run(['bash', '-c', f'yes | "{sm}" --sdk_root="{sdk_root}" --licenses > /dev/null 2>&1 || true'], env=env, check=False)
          res = subprocess.run([sm, f'--sdk_root={sdk_root}', 'platforms;android-36', 'build-tools;36.0.0'], env=env)
          if res.returncode != 0:
              print('Reintentando instalación de plataforma 36 y build-tools...')
              subprocess.run([sm, f'--sdk_root={sdk_root}', 'platforms;android-36', 'build-tools;36.0.0'], env=env, check=True)
          PY

      - name: Clave de firma para el APK release
        shell: bash
        run: |
          mkdir -p ~/.android
          [ -f ~/.android/debug.keystore ] || keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Compilar APK release
        run: gradle --no-daemon -p project assembleRelease

      - name: Resumen del APK
        shell: bash
        run: |
          {
            echo "### APK generado"
            echo '```'
            ls -lh project/app/build/outputs/apk/release/*.apk
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: project/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
