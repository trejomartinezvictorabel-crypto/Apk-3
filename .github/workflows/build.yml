          sdk_root = os.environ.get('ANDROID_SDK_ROOT') or os.environ.get('ANDROID_HOME') or '/usr/local/lib/android/sdk'
          os.makedirs(sdk_root, exist_ok=True)

          # Asegura carpeta licenses con hashes estándar para evitar fallos en sdkmanager
          lic_dir = os.path.join(sdk_root, 'licenses')
          os.makedirs(lic_dir, exist_ok=True)
          for fname, content in {
              'android-sdk-license': '24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd\n',
              'android-sdk-preview-license': '84831b9409646a918e30573bab4c9c91346d8abd\n',
              'android-googletv-license': '60108f7c06a1e840564b3b7198856d2250360a08\n',
              'mips-android-sys-image-license': 'e9acab5b5fbb560abb72ca8051a89f0c0f7604c8\n',
          }.items():
              fp = os.path.join(lic_dir, fname)
              if not os.path.exists(fp):
                  with open(fp, 'w', encoding='utf-8') as f:
                      f.write(content)

          # Busca sdkmanager disponible
